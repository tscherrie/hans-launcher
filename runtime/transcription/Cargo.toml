[package]
name = "hans-codex-transcribe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# package-transcription-helper.sh verifies and materializes this pinned source.
codex-login = { path = "build/source/codex/codex-rs/login" }
codex-http-client = { path = "build/source/codex/codex-rs/http-client" }
native-tls = { version = "0.2", features = ["vendored"] }
reqwest = { version = "0.12", features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.release]
strip = "symbols"
debug = 0
panic = "abort"
lto = "thin"
codegen-units = 1
